name: 금곡 강습 신청 알림

on:
  # 시각은 맥의 launchd가 잡는다(scripts/mac/*.plist → 아침 8:00 / 저녁 19:00 KST).
  # GitHub 예약 실행은 공용 큐를 타서 4시간 넘게 밀린 적이 있어(21:17 예정 → 새벽 2시 실행)
  # 접수 시작 시각을 놓칠 수 있다. 수동 실행(workflow_dispatch)은 큐 없이 즉시 시작된다.
  workflow_dispatch:
    inputs:
      # 맥 예약이 넘긴다(08:00 → morning, 19:00 → evening). 맥이 잠들어 실행이 12시 넘어 밀려도
      # 아침 실행은 아침 알림으로 처리하기 위함. 비우면(손으로 실행) 실행 시각으로 판단.
      mode:
        description: '실행 구분(morning|evening). 비우면 실행 시각으로 판단'
        type: string
        default: ''
      dry_run:
        description: '테스트: 텔레그램 발송 없이 메시지만 출력'
        type: boolean
        default: false
      force:
        description: '테스트: 강제로 보낼 알림 종류(new|signup-eve|signup|lottery)'
        type: string
        default: ''

jobs:
  alert:
    # 매일 점검과 같은 맥 러너. 공지 첨부를 로컬에서 읽으므로(AI·API 미사용) 비용은 없다.
    runs-on: [self-hosted, seongnam-mac]
    timeout-minutes: 30

    steps:
      # 잡 전체 동안 맥이 잠들지 않게 한다(이유는 update-schedule.yml 같은 단계 주석 참고).
      - name: 잡 동안 잠자기 방지
        run: nohup caffeinate -dimsu -w "$(pgrep -n -f Runner.Worker)" >/dev/null 2>&1 &

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 강습 공지 확인 & 알림
        run: caffeinate -dimsu node scripts/lesson-alert.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LESSON_FORCE: ${{ inputs.force }}
          LESSON_MODE: ${{ inputs.mode }}
